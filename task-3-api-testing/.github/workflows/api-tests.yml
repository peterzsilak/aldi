name: API Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
defaults:
  run:
    working-directory: task-3-api-testing
jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: task-3-api-testing/.nvmrc
        cache: npm
        cache-dependency-path: task-3-api-testing/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Typecheck and lint
      run: npm run check
    - name: Run API tests
      run: npm run test:raw
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: task-3-api-testing/playwright-report/
        retention-days: 30
