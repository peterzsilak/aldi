name: API Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      project:
        description: Browser project to run
        required: false
        type: choice
        default: all
        options: [all, chromium, firefox, webkit]
      tests_per_shard:
        description: Maximum tests per shard
        required: false
        type: string
        default: '10'

jobs:
  install-dependencies:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: task-3-api-testing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: task-3-api-testing/.nvmrc
          cache: npm
          cache-dependency-path: task-3-api-testing/package-lock.json
      - name: Install dependencies
        run: npm ci

  run-quality-checks:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: install-dependencies
    defaults:
      run:
        working-directory: task-3-api-testing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: task-3-api-testing/.nvmrc
          cache: npm
          cache-dependency-path: task-3-api-testing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and lint
        run: npm run check

  discover-shards:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    needs: run-quality-checks
    defaults:
      run:
        working-directory: task-3-api-testing
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: task-3-api-testing/.nvmrc
          cache: npm
          cache-dependency-path: task-3-api-testing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Compute shard matrix
        id: compute
        shell: bash
        env:
          SELECTED_PROJECT: ${{ github.event_name == 'workflow_dispatch' && inputs.project || 'all' }}
          TESTS_PER_SHARD: ${{ github.event_name == 'workflow_dispatch' && inputs.tests_per_shard || '10' }}
          PLAYWRIGHT_TEST_ARGS: ${{ vars.PLAYWRIGHT_TEST_ARGS }}
        run: |
          set -euo pipefail

          discovered_projects=$(npx playwright test --list ${PLAYWRIGHT_TEST_ARGS:-} 2>/dev/null | sed -nE 's/^\s*\[([^]]+)\].*/\1/p' | sort -u)
          if [ -z "$discovered_projects" ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$SELECTED_PROJECT" != "all" ]; then
            discovered_projects="$SELECTED_PROJECT"
          fi

          json='['
          for project in $discovered_projects; do
            count=$(npx playwright test --list --project="$project" ${PLAYWRIGHT_TEST_ARGS:-} 2>/dev/null | grep -E -c ':[0-9]+:[0-9]+' || true)
            count=$(echo "$count" | tr -d '[:space:]')
            [ -n "$count" ] || count=0

            if [ "$count" -gt 0 ]; then
              shards=$(( (count + TESTS_PER_SHARD - 1) / TESTS_PER_SHARD ))
            else
              shards=0
            fi

            for shard in $(seq 1 "$shards"); do
              if [ "$json" != "[" ]; then
                json="$json,"
              fi
              json="${json}{\"project\":\"$project\",\"shard\":\"$shard\",\"total_shards\":\"$shards\"}"
            done
          done
          json="$json]"

          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  execute-tests:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    needs: discover-shards
    if: ${{ needs.discover-shards.outputs.matrix != '[]' && needs.discover-shards.outputs.matrix != '' }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.discover-shards.outputs.matrix) }}
    defaults:
      run:
        working-directory: task-3-api-testing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: task-3-api-testing/.nvmrc
          cache: npm
          cache-dependency-path: task-3-api-testing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run API tests
        env:
          PLAYWRIGHT_TEST_ARGS: ${{ vars.PLAYWRIGHT_TEST_ARGS }}
        run: npx playwright test --project="${{ matrix.project }}" --shard=${{ matrix.shard }}/${{ matrix.total_shards }} ${PLAYWRIGHT_TEST_ARGS:-}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: task-3-api-testing/playwright-report/
          retention-days: 30
